# Run nginx in foreground.
daemon off;

# This is run inside Docker.
user root;

# Pid storage location.
pid /var/run/nginx.pid;

# Set number of worker processes.
worker_processes 1;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Write error log to the app log.
error_log /proc/1/fd/1 error;

# Max num of simultaneous connections by a worker process.
events {
    worker_connections 512;
}

http {
    include /etc/nginx/includes/mime.types;

    access_log              off;
    default_type            application/octet-stream;
    gzip                    on;
    keepalive_timeout       65;
    sendfile                on;
    server_tokens           off;
    tcp_nodelay             on;
    tcp_nopush              on;

    # A restore of SparkyFitness' own backup is uploaded in one piece, and
    # holds every picture anybody ever uploaded.
    client_max_body_size    512M;

    # The path Home Assistant serves this app below, written into the page as
    # its base. Only ever something of the one shape Home Assistant hands out,
    # since it ends up inside the page.
    map $http_x_ingress_path $ingress_base {
        default                                    "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]+$"    $http_x_ingress_path;
    }

    # SparkyFitness checks the origin of every sign-in against the address it
    # is served from, which is not known to this app, and could be several. So
    # NGINX checks it instead: a request whose origin is the very address it
    # came in on is same-origin, and presented to SparkyFitness under the one
    # origin it trusts. Anything else passes through as sent, and is refused.
    map "$http_origin $scheme://$http_host" $direct_origin {
        default         $http_origin;
        "~^(\S+) \1$"   "http://sparkyfitness.invalid";
    }

    include /etc/nginx/includes/upstream.conf;
    include /etc/nginx/servers/*.conf;
}

# The API, and what SparkyFitness serves next to it: uploaded pictures, the
# endpoint health apps push their data to, and the MCP endpoint for AI clients.
location ^~ /api/ {
    proxy_pass http://sparkyfitness;
}

location ^~ /uploads/ {
    proxy_pass http://sparkyfitness;
}

location ^~ /health-data {
    proxy_pass http://sparkyfitness/api/health-data;
}

location ^~ /mcp {
    proxy_pass http://sparkyfitness;
}

# The client's scripts and styles carry a hash of their content in their name.
location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Everything else is the client, which does its own routing. The page itself
# is never cached, since under Ingress it carries the path it was served below.
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}

proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_max_temp_file_size    0;

# The assistant streams its answers, and the MCP endpoint is a stream. Neither
# arrives before it is complete when NGINX buffers it.
proxy_buffering             off;

# Backups, restores and imports are one request that SparkyFitness works
# through before it answers.
proxy_read_timeout          600s;
proxy_send_timeout          600s;

# A page has to arrive uncompressed, or the Ingress rewrite of its base would
# be looking at gzip rather than at the document. NGINX compresses on the way
# out instead.
proxy_set_header Accept-Encoding "";

proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;

# What Home Assistant says about who is asking only ever reaches SparkyFitness
# under the names the Ingress server sets on purpose, never as sent.
proxy_set_header X-Remote-User-Id "";
proxy_set_header X-Remote-User-Name "";
proxy_set_header X-Remote-User-Display-Name "";
